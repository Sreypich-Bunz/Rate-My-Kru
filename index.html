    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-size:14px;color:#3A4048\"><option>2021<\u002Foption><option>2022<\u002Foption><\u002Fsc-raw-select>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <label style=\"display:block;font-weight:700;font-size:13.5px;margin-bottom:7px\">{{ form.endLabel }} <span style=\"color:#C4402F\">*<\u002Fspan><\u002Flabel>\n        <div style=\"display:flex;gap:8px\">\n          <sc-raw-select style=\"flex:1;border:1px solid #E3E5E9;border-radius:10px;padding:11px;background:#fff;font-size:14px;color:#3A4048\"><option>Sep<\u002Foption><option>Jun<\u002Foption><\u002Fsc-raw-select>\n          <sc-raw-select style=\"flex:1;border:1px solid #E3E5E9;border-radius:10px;padding:11px;background:#fff;font-size:14px;color:#3A4048\"><option>2025<\u002Foption><option>2024<\u002Foption><\u002Fsc-raw-select>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-weight:700;font-size:15px;margin-bottom:12px\">{{ t.ratingScores }}<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px\">\n      <sc-for list=\"{{ form.cats }}\" as=\"c\" hint-placeholder-count=\"10\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid #E3E5E9;border-radius:11px;padding:9px 14px\">\n          <span style=\"font-size:13.5px;font-weight:600\">{{ c }}<\u002Fspan>\n          <div style=\"display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:#6B7280\">\n            <sc-raw-select style=\"border:none;background:transparent;font-family:'JetBrains Mono',monospace;font-weight:700;text-align:right;outline:none\"><option>7<\u002Foption><option>8<\u002Foption><option>9<\u002Foption><option>10<\u002Foption><option>6<\u002Foption><option>5<\u002Foption><\u002Fsc-raw-select> / 10\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"margin-top:24px\">\n      <label style=\"display:block;font-weight:700;font-size:13.5px;margin-bottom:7px\">{{ t.comment }}<\u002Flabel>\n      <textarea maxlength=\"500\" placeholder=\"{{ form.commentPh }}\" style=\"width:100%;border:1px solid #E3E5E9;border-radius:12px;padding:14px;min-height:120px;resize:vertical;font-size:14.5px\"><\u002Ftextarea>\n      <div style=\"text-align:right;font-size:12px;color:#6B7280;margin-top:5px\">0 / 500<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:20px\">\n      <label style=\"display:block;font-weight:700;font-size:13.5px;margin-bottom:9px\">{{ form.recLabel }}<\u002Flabel>\n      <div style=\"display:flex;gap:16px;flex-wrap:wrap\">\n        <sc-for list=\"{{ recOptions }}\" as=\"o\" hint-placeholder-count=\"3\">\n          <label style=\"display:flex;align-items:center;gap:8px;font-size:14px;color:#3A4048\"><input type=\"radio\" name=\"rec\" style=\"accent-color:#0B0F14;width:16px;height:16px\"> {{ o }}<\u002Flabel>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:28px\">\n      <button sc-camel-on-click=\"{{ deleteDraft }}\" style=\"padding:12px 20px;border-radius:12px;border:none;background:#FBEAE7;color:#C4402F;font-weight:600;font-size:14.5px\">{{ t.delete }}<\u002Fbutton>\n      <div style=\"display:flex;gap:10px;margin-left:auto;flex-wrap:wrap\">\n        <button sc-camel-on-click=\"{{ saveDraft }}\" style=\"padding:12px 20px;border-radius:12px;border:1px solid #E3E5E9;background:transparent;color:#3A4048;font-weight:600;font-size:14.5px\">{{ t.saveDraft }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ submitReview }}\" style=\"padding:12px 20px;border-radius:12px;border:none;background:#0B0F14;color:#fff;font-weight:600;font-size:14.5px\">{{ t.submit }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<!-- ===================== ABOUT ===================== -->\n<sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n<main style=\"animation:fadeUp .3s ease\">\n  <section style=\"background:#F4F5F7;padding:clamp(36px,6vw,64px) 0\">\n    <div style=\"max-width:760px;margin:0 auto;padding:0 clamp(16px,3vw,28px)\">\n      <p style=\"text-align:center;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8A5A12;margin-bottom:10px\">{{ t.mission }}<\u002Fp>\n      <h2 style=\"font-size:clamp(24px,3.4vw,34px);margin-bottom:18px;text-align:center;text-wrap:balance\">Helping every student choose with open eyes<\u002Fh2>\n      <p style=\"color:#3A4048;margin-bottom:1em\">Rate My Kru exists because course catalogs and glossy campus tours don't tell you what it's actually like to sit in the lecture hall. We collect first-hand, verified reviews from students across Cambodia so the next intake can make an informed choice — before enrollment, not after.<\u002Fp>\n      <p style=\"color:#3A4048\">Every score on the platform is built from ten consistent categories, so a Phnom Penh engineering faculty and a Battambang business faculty can be compared on the same terms.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section style=\"padding:clamp(36px,6vw,64px) 0\">\n    <div style=\"max-width:760px;margin:0 auto;padding:0 clamp(16px,3vw,28px)\">\n      <p style=\"text-align:center;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8A5A12;margin-bottom:10px\">{{ t.vision }}<\u002Fp>\n      <h2 style=\"font-size:clamp(24px,3.4vw,34px);margin-bottom:18px;text-align:center;text-wrap:balance\">A shared record of Cambodian higher education<\u002Fh2>\n      <p style=\"color:#3A4048;margin-bottom:1em\">We want Rate My Kru to become the first stop for any student, parent, or counselor comparing universities in Cambodia — not just for admissions, but for module selection and career planning once you're enrolled.<\u002Fp>\n      <p style=\"color:#3A4048\">As the review base grows, we're building tools for universities themselves to see where students are struggling, and to close the loop with real improvements.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section style=\"padding:clamp(36px,6vw,64px) 0;background:#F4F5F7\">\n    <div style=\"max-width:1160px;margin:0 auto;padding:0 clamp(16px,3vw,28px)\">\n      <h2 style=\"font-size:clamp(22px,3vw,28px);text-align:center;margin-bottom:28px\">{{ t.founders }}<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px\">\n        <sc-for list=\"{{ founders }}\" as=\"f\" hint-placeholder-count=\"4\">\n          <div style=\"border:1px solid #E3E5E9;border-radius:16px;padding:20px;background:#fff;display:flex;gap:14px\">\n            <div style=\"width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,#FBF0DC,#ECEEF1);flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:#8A5A12\">{{ f.initials }}<\u002Fdiv>\n            <div>\n              <h4 style=\"font-size:15.5px\">{{ f.name }}<\u002Fh4>\n              <div style=\"font-size:12.5px;color:#6B7280;font-weight:600;margin:2px 0 8px\">{{ f.role }}<\u002Fdiv>\n              <p style=\"font-size:13.5px;color:#3A4048\">{{ f.bio }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<!-- ===================== METHODOLOGY ===================== -->\n<sc-if value=\"{{ isMethod }}\" hint-placeholder-val=\"{{ false }}\">\n<main style=\"animation:fadeUp .3s ease\">\n  <section style=\"background:#F4F5F7;padding:clamp(36px,6vw,64px) 0\">\n    <div style=\"max-width:760px;margin:0 auto;padding:0 clamp(16px,3vw,28px)\">\n      <h2 style=\"font-size:clamp(24px,3.4vw,32px);margin-bottom:18px\">{{ t.purpose }}<\u002Fh2>\n      <p style=\"color:#3A4048;margin-bottom:1em\">Rate My Kru's methodology exists to keep every score fair, comparable, and hard to game. This page explains exactly how a rating turns into the number you see on a university, faculty, or professor page.<\u002Fp>\n      <p style=\"color:#3A4048\">We publish it openly so students can trust the score, and so universities know precisely what's being measured.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section style=\"padding:clamp(36px,6vw,64px) 0\">\n    <div style=\"max-width:760px;margin:0 auto;padding:0 clamp(16px,3vw,28px);display:grid;gap:32px\">\n      <h2 style=\"font-size:clamp(22px,3vw,30px)\">{{ t.ratingExplained }}<\u002Fh2>\n      <div>\n        <h3 style=\"font-size:19px;margin-bottom:10px\">Assessment Criteria<\u002Fh3>\n        <p style=\"color:#3A4048;margin-bottom:1em\">Every review scores ten fixed categories — teaching quality, course materials, facilities, support services, career prep, campus life, value for money, class size, communication, and extracurriculars — each from 0 to 10.<\u002Fp>\n        <p style=\"color:#3A4048\">Professor reviews use a shorter, module-specific set: clarity, engagement, fairness, availability, and feedback quality, plus optional notes on difficulty, class size, and workload.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h3 style=\"font-size:19px;margin-bottom:10px\">How Scores Are Calculated<\u002Fh3>\n        <p style=\"color:#3A4048;margin-bottom:1em\">An entity's overall score is the average of its category scores across all eligible reviews, weighted so reviews from the last three years count more than older ones.<\u002Fp>\n        <p style=\"color:#3A4048\">The \"% recommended\" figure is simply the share of reviewers who answered \"Yes\" to the recommendation question — \"Unsure\" responses are excluded rather than counted against it.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<!-- ===================== SUPPORT ===================== -->\n<sc-if value=\"{{ isSupport }}\" hint-placeholder-val=\"{{ false }}\">\n<main style=\"animation:fadeUp .3s ease\">\n  <section style=\"background:#F4F5F7;padding:clamp(32px,5vw,56px) 0\">\n    <div style=\"max-width:1160px;margin:0 auto;padding:0 clamp(16px,3vw,28px)\">\n      <h2 style=\"font-size:clamp(21px,3vw,28px);margin-bottom:20px;max-width:600px\">{{ t.supportTitle }}<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px\">\n        <sc-for list=\"{{ articles }}\" as=\"a\" hint-placeholder-count=\"9\">\n          <button sc-camel-on-click=\"{{ a.open }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid #E3E5E9;border-radius:12px;padding:15px 17px;background:#fff;font-weight:600;font-size:14.5px;text-align:left;color:#0B0F14\">\n            {{ a.title }}\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6B7280\" stroke-width=\"2.4\" style=\"flex:none\"><path d=\"m9 18 6-6-6-6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section style=\"padding:clamp(32px,5vw,56px) 0\">\n    <div style=\"max-width:1160px;margin:0 auto;padding:0 clamp(16px,3vw,28px);display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:clamp(28px,5vw,48px);align-items:start\">\n      <div>\n        <h2 style=\"font-size:22px;margin-bottom:16px\">{{ t.faqs }}<\u002Fh2>\n        <sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"5\">\n          <div style=\"border-bottom:1px solid #E3E5E9\">\n            <button sc-camel-on-click=\"{{ f.toggle }}\" style=\"width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 0;background:none;border:none;font-weight:600;font-size:14.5px;text-align:left;color:#0B0F14\">\n              {{ f.q }}\n              <span style=\"color:#6B7280;font-size:18px;flex:none\">{{ f.icon }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ f.open }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"font-size:14px;color:#3A4048;padding:0 0 15px\">{{ f.a }}<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #E3E5E9;border-radius:20px;padding:24px;background:#fff\">\n        <h3 style=\"font-size:18px;margin-bottom:16px\">{{ t.emailUs }}<\u002Fh3>\n        <div style=\"display:grid;gap:14px\">\n          <sc-for list=\"{{ contactFields }}\" as=\"c\" hint-placeholder-count=\"3\">\n            <div>\n              <label style=\"display:block;font-weight:700;font-size:13px;margin-bottom:6px\">{{ c }}<\u002Flabel>\n              <input style=\"width:100%;border:1px solid #E3E5E9;border-radius:10px;padding:11px 13px;font-size:14px\">\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div>\n            <label style=\"display:block;font-weight:700;font-size:13px;margin-bottom:6px\">{{ t.message }}<\u002Flabel>\n            <textarea style=\"width:100%;border:1px solid #E3E5E9;border-radius:12px;padding:13px;min-height:110px;resize:vertical;font-size:14px\"><\u002Ftextarea>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ sendMessage }}\" style=\"width:100%;padding:12px;border-radius:12px;border:none;background:#0B0F14;color:#fff;font-weight:600;font-size:14.5px\">{{ t.submit }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<!-- ===================== ARTICLE ===================== -->\n<sc-if value=\"{{ isArticle }}\" hint-placeholder-val=\"{{ false }}\">\n<main style=\"animation:fadeUp .3s ease\">\n  <div style=\"background:#F4F5F7;border-bottom:1px solid #E3E5E9;padding:26px 0\">\n    <div style=\"max-width:1160px;margin:0 auto;padding:0 clamp(16px,3vw,28px)\">\n      <button sc-camel-on-click=\"{{ goSupport }}\" style=\"display:inline-flex;align-items:center;gap:6px;background:none;border:none;padding:0;font-size:13.5px;font-weight:600;color:#3A4048;margin-bottom:12px\">← {{ t.back }}<\u002Fbutton>\n      <h1 style=\"font-size:clamp(22px,3.2vw,28px)\">How to verify your student email<\u002Fh1>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"max-width:720px;margin:0 auto;padding:clamp(28px,5vw,48px) clamp(16px,3vw,28px)\">\n    <h2 style=\"font-size:20px;margin-bottom:10px\">Why verification matters<\u002Fh2>\n    <p style=\"color:#3A4048;margin-bottom:1em\">Every review on Rate My Kru is tied to a verified student account. Verification confirms you're currently enrolled or graduated from the institution you're rating, which is what keeps scores trustworthy for everyone reading them.<\u002Fp>\n    <p style=\"color:#3A4048;margin-bottom:2em\">You only need to verify once per university — after that, you can rate any faculty or lecturer within it.<\u002Fp>\n    <h2 style=\"font-size:20px;margin-bottom:10px\">Verifying with your student email<\u002Fh2>\n    <p style=\"color:#3A4048;margin-bottom:1em\">Open Settings → Email &amp; verification, then enter your university-issued address (it should end in your school's .edu.kh domain). We'll send a six-digit code that's valid for fifteen minutes.<\u002Fp>\n    <p style=\"color:#3A4048;margin-bottom:2em\">If your university doesn't issue student emails, upload a photo of your student ID instead — our team manually reviews these within two business days.<\u002Fp>\n    <h2 style=\"font-size:20px;margin-bottom:10px\">Troubleshooting verification issues<\u002Fh2>\n    <p style=\"color:#3A4048;margin-bottom:1em\">Codes not arriving usually means the email landed in spam, or your school's mail server is blocking automated senders. Try adding verify@ratemykru.com to your contacts and resending.<\u002Fp>\n    <p style=\"color:#3A4048\">Still stuck? Use the contact form on the support page and include your university name — our support team typically replies within a day.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<!-- ===================== SETTINGS ===================== -->\n<sc-if value=\"{{ isSettings }}\" hint-placeholder-val=\"{{ false }}\">\n<main style=\"animation:fadeUp .3s ease\">\n  <div style=\"background:#F4F5F7;border-bottom:1px solid #E3E5E9;padding:26px 0\">\n    <div style=\"max-width:1160px;margin:0 auto;padding:0 clamp(16px,3vw,28px);display:flex;align-items:center;gap:14px\">\n      <span style=\"width:44px;height:44px;border-radius:999px;background:#FBF0DC;color:#8A5A12;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none\">{{ userInitials }}<\u002Fspan>\n      <div>\n        <h1 style=\"font-size:clamp(20px,3vw,26px)\">{{ t.settings }}<\u002Fh1>\n        <p style=\"font-size:13.5px;color:#6B7280\">{{ userName }} · {{ userHandle }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"max-width:1160px;margin:0 auto;padding:clamp(24px,4vw,40px) clamp(16px,3vw,28px);display:flex;gap:clamp(20px,3vw,36px);align-items:flex-start;flex-wrap:wrap\">\n    <nav style=\"flex:0 1 250px;min-width:min(250px,100%);display:flex;flex-direction:column;gap:3px;position:sticky;top:88px\">\n      <sc-for list=\"{{ settingsNav }}\" as=\"s\" hint-placeholder-count=\"8\">\n        <button sc-camel-on-click=\"{{ s.go }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:11px 13px;border-radius:11px;border:1px solid {{ s.line }};background:{{ s.bg }};color:{{ s.fg }};font-size:14.5px;font-weight:{{ s.weight }}\">\n          {{ s.label }}\n          <sc-if value=\"{{ s.badge }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;background:{{ s.badgeBg }};color:{{ s.badgeFg }};border-radius:999px;padding:2px 7px\">{{ s.badge }}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n\n    <section style=\"flex:1 1 420px;min-width:min(360px,100%)\">\n\n      <sc-if value=\"{{ sAccount }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"border:1px solid #E3E5E9;border-radius:18px;background:#fff;padding:clamp(18px,3vw,26px)\">\n          <h2 style=\"font-size:19px;margin-bottom:4px\">{{ t.sAccount }}<\u002Fh2>\n          <p style=\"font-size:13.5px;color:#6B7280;margin-bottom:22px\">{{ t.sAccountSub }}<\u002Fp>\n          <div style=\"display:flex;align-items:center;gap:16px;padding-bottom:22px;border-bottom:1px solid #E3E5E9;margin-bottom:22px;flex-wrap:wrap\">\n            <span style=\"width:64px;height:64px;border-radius:999px;background:#FBF0DC;color:#8A5A12;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;flex:none\">{{ userInitials }}<\u002Fspan>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n              <button sc-camel-on-click=\"{{ noop }}\" style=\"padding:9px 14px;border-radius:10px;background:#fff;border:1px solid #E3E5E9;font-weight:600;font-size:13.5px\">{{ t.uploadPhoto }}<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ noop }}\" style=\"padding:9px 14px;border-radius:10px;background:transparent;border:1px solid transparent;color:#6B7280;font-weight:600;font-size:13.5px\">{{ t.remove }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px\">\n            <sc-for list=\"{{ accountFields }}\" as=\"f\" hint-placeholder-count=\"6\">\n              <div>\n                <label style=\"display:block;font-weight:700;font-size:13px;margin-bottom:6px\">{{ f.label }}<\u002Flabel>\n                <sc-if value=\"{{ f.isSelect }}\" hint-placeholder-val=\"{{ false }}\">\n                  <sc-raw-select style=\"width:100%;border:1px solid #E3E5E9;border-radius:10px;padding:11px 12px;background:#fff;font-size:14px;color:#3A4048\">\n                    <sc-for list=\"{{ f.options }}\" as=\"o\" hint-placeholder-count=\"2\"><option>{{ o }}<\u002Foption><\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ f.isText }}\" hint-placeholder-val=\"{{ true }}\">\n                  <input value=\"{{ f.value }}\" style=\"width:100%;border:1px solid #E3E5E9;border-radius:10px;padding:11px 12px;font-size:14px\">\n                <\u002Fsc-if>\n                <sc-if value=\"{{ f.hint }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size:12px;color:#6B7280;margin-top:5px\">{{ f.hint }}<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px;justify-content:flex-end;margin-top:26px;flex-wrap:wrap\">\n            <button sc-camel-on-click=\"{{ noop }}\" style=\"padding:11px 18px;border-radius:11px;border:1px solid #E3E5E9;background:#fff;font-weight:600;font-size:14px\">{{ t.cancel }}<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ saveSettings }}\" style=\"padding:11px 18px;border-radius:11px;border:none;background:#0B0F14;color:#fff;font-weight:600;font-size:14px\">{{ t.saveChanges }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid #E3E5E9;border-radius:18px;background:#fff;padding:clamp(18px,3vw,26px);margin-top:16px\">\n          <h2 style=\"font-size:19px;margin-bottom:4px\">{{ t.education }}<\u002Fh2>\n          <p style=\"font-size:13.5px;color:#6B7280;margin-bottom:18px\">{{ t.educationSub }}<\u002Fp>\n          <div style=\"display:flex;gap:12px;align-items:flex-start;background:#F4F5F7;border-radius:12px;padding:13px 14px;margin-bottom:14px\">\n            <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#3A4048\" stroke-width=\"2\" style=\"flex:none;margin-top:3px\"><rect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"><\u002Frect><path d=\"M8 11V7a4 4 0 0 1 8 0v4\"><\u002Fpath><
